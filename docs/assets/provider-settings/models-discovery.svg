<text data-row="9" x="12.2" y="237.6" font-family="Fira Code,monospace" font-size="20" fill="#e4e8ee">  [ ] mistral-small  ·  deployment mistral-small-latest</text>
<text data-row="10" x="12.2" y="262.0" font-family="Fira Code,monospace" font-size="20" fill="#e4e8ee"></text>
