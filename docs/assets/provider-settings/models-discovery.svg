<text data-row="13" x="12.2" y="335.2" font-family="Fira Code,monospace" font-size="20" fill="#aab2bd">Create enabled: saved key + valid model.</text>
<text data-row="14" x="12.2" y="359.6" font-family="Fira Code,monospace" font-size="20" fill="#aab2bd">Discovery failure does not block this configuration.</text>
<text data-row="15" x="12.2" y="384.0" font-family="Fira Code,monospace" font-size="20" fill="#e4e8ee"></text>
<text data-row="16" x="12.2" y="408.4" font-family="Fira Code,monospace" font-size="20" fill="#e4e8ee"></text>
