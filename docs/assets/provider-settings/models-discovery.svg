<svg xmlns="http://www.w3.org/2000/svg" data-cols="80" data-rows="24" viewBox="0 0 976 585.6" role="img">
<title>Provider Models — Discovery failed</title>
<desc>Mistral Provider Models screen. Discovery failed, but a saved credential and valid enabled model keep Create provider available. The checked glm-5-3 model was manually entered. Retry is focused; configured models remain intact.</desc>
<rect width="976" height="585.6" fill="#171a1f"/>
