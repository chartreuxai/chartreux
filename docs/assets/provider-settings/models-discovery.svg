<text data-row="2" x="12.2" y="66.8" font-family="Fira Code,monospace" font-size="20" fill="#ff9292">Discovery status: Failed · unsupported response</text>
<text data-row="3" x="12.2" y="91.2" font-family="Fira Code,monospace" font-size="20" fill="#aab2bd">Discovery did not remove configured models.</text>
<text data-row="4" x="12.2" y="115.6" font-family="Fira Code,monospace" font-size="20" fill="#aab2bd">ACTIONS  ·  Up/Down moves through every action</text>
<rect data-focus-row="5" x="0" y="122.0" width="976" height="24.4" fill="#dce3ed"/>
