---
repos:
  - repo: local
    hooks:
      - id: docs-build
        name: Build documentation (strict)
        entry: mkdocs build --strict
        language: python
        additional_dependencies: ["mkdocs>=1.6.1"]
        files: ^(docs/|mkdocs\.yml$|README\.md$|CHANGELOG\.md$|ACKNOWLEDGEMENTS\.md$|\.pre-commit-config\.yaml$)
        exclude: ^docs/reviews/
        pass_filenames: false
      # Artifact-side secret scan (P2-i): blocks user-driven commits that
      # stage a secret. Excludes are the seeded-synthetic-secret test
      # fixtures; see the commit message for the per-path justification.
      - id: secret-scan
        name: Secret scan (block committed secrets)
        entry: uv run python -m chartreux.core.tools.secret_scan_hook
        language: system
        pass_filenames: true
        exclude: ^(tests/agent_loop/test_chartreux_policy_denials\.py|tests/agent_loop/test_secret_redaction_exfil\.py|tests/cli/test_question_app\.py|tests/cli/textual_ui/test_dangerous_command_question\.py|tests/core/hooks/test_hooks\.py|tests/core/test_background_jobs\.py|tests/core/tools/test_secret_redaction\.py|tests/core/tools/test_secret_scan\.py|tests/recovery/test_failure_envelope\.py|tests/tools/test_bash_project_env\.py|tests/tools/test_glob_expansion_budget_diagnostics\.py|tests/tools/test_shell_diagnostics\.py)$

  - repo: https://github.com/mpalmer/action-validator
    rev: 7fa61514fb806fc9afd664b909e83584aca84f78 # v0.7.0
    hooks:
      - id: action-validator

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: docs/reviews/(tui-affordances|web-search)/evidence/.*\.txt$
      - id: trailing-whitespace
        exclude: (tests/snapshots/.*\.svg$|docs/reviews/(tui-affordances|web-search)/evidence/.*\.(svg|txt)$)

  - repo: https://github.com/fsouza/mirrors-pyright
    rev: 35d1c990dba50abf6fabe1becfa0c289042b2073 # v1.1.407
    hooks:
      - id: pyright

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 5e2fb545eba1ea9dc051f6f962d52fe8f76a9794 # v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix, --unsafe-fixes]
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/crate-ci/typos
    rev: 392b78fe18a52790c53f42456e46124f77346842 # v1.34.0
    hooks:
      - id: typos
        args: [--write-changes]
        exclude: (__snapshots__/.*\.svg$|docs/reviews/(tui-affordances|web-search)/evidence/.*\.(svg|txt)$)
